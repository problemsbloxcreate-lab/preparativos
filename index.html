<!doctype html>
<html lang="pt-BR" class="cel">
<head>
<meta charset="utf-8">
<script>/* visual Celeste (2.0): tema escuro ou claro, o mesmo para o Estúdio todo (sol/lua no cabeçalho) */
try { document.documentElement.dataset.tema = localStorage.getItem('ep-tema') === 'claro' ? 'claro' : 'escuro'; } catch { document.documentElement.dataset.tema = 'escuro'; }</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREPARATIVOS · Estúdio Problems</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-180.png">
<script>
// o Preparativos mora no endereço único do Estúdio Problems; quem abrir a cópia do GitHub Pages vai para lá
if (location.hostname === 'problemsbloxcreate-lab.github.io') location.replace('https://estudio.problemsraiz.workers.dev/preparativos/' + location.pathname.replace(/^\/preparativos\/?/, '') + location.search + location.hash);
</script>
<!-- login do Google do menu: sem sessão, manda para o menu e volta para cá depois de entrar -->
<script src="/estudio-login.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="preload" href="fontes/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/celeste.css">
</head>
<body>
<header class="top">
  <a class="logo" href="./" title="Voltar ao início"><span class="ic-prog" data-estudio-icone="pr" aria-hidden="true"></span><div><b>PREPARATIVOS</b><small>Estúdio Problems</small></div></a>
  <nav class="abas" data-abas>
    <button data-aba="roteiros" class="on">Roteiros</button>
    <button data-aba="ideias">Ideias</button>
    <button data-aba="personagens">Personagens</button>
  </nav>
  <div class="esp"></div>
  <button class="tema-bt" data-tema-bt type="button"></button>
  <span data-estudio-conta></span>
</header>
<main id="tela"></main>
<div id="avisos" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/roteiro.js"></script>
<script src="js/editor.js"></script>
<script src="dublar/cortes.js"></script>
<script src="js/app.js"></script>
<script>/* botão da conta: o círculo da NUVEM (espaço já usado na nuvem da equipe), igual no Animador */
window.ESTUDIO_CONTA = { nuvem: true, token: () => window.EstudioLogin?.token?.(), aoMudarNuvem: () => { try { if (!S.P && S.aba === 'roteiros') pintaInicio(true); } catch { } } };
</script>
<script>/* sol/lua: troca claro ↔ escuro (vale para o Estúdio todo; outras abas abertas mudam junto) */
(() => { const b = document.querySelector('[data-tema-bt]'), H = document.documentElement;
  const SOL = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const LUA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const pinta = () => { const esc = H.dataset.tema !== 'claro'; b.innerHTML = esc ? SOL : LUA; b.title = esc ? 'Usar o tema claro' : 'Usar o tema escuro'; b.setAttribute('aria-label', b.title); };
  b.onclick = () => { H.dataset.tema = H.dataset.tema === 'claro' ? 'escuro' : 'claro'; try { localStorage.setItem('ep-tema', H.dataset.tema); } catch { } pinta(); };
  addEventListener('storage', e => { if (e.key === 'ep-tema') { H.dataset.tema = e.newValue === 'claro' ? 'claro' : 'escuro'; pinta(); } });
  pinta(); })();
</script>
<script src="/estudio-conta.js" defer></script>
</body>
</html>
